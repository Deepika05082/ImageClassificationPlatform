name: CI Pipeline
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Build Docker image
        run: docker build -t ghcr.io/<user>/catsdogs:${{ github.sha }} .
      - name: Push image
        run: echo $CR_PAT | docker login ghcr.io -u USERNAME --password-stdin
      - run: docker push ghcr.io/<user>/catsdogs:${{ github.sha }}
