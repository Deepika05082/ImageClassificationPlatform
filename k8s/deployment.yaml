apiVersion: apps/v1
kind: Deployment
metadata:
  name: catsdogs-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catsdogs
  template:
    metadata:
      labels:
        app: catsdogs
    spec:
      containers:
      - name: catsdogs
        image: ghcr.io/<user>/catsdogs:latest
        ports:
        - containerPort: 8000
